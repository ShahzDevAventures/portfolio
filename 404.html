<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>404 — wrong turn · Shahzaib Siddiqui</title>
<link rel="icon" href="/assets/og/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=JetBrains+Mono:wght@400;500;700;800&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css" />
<link rel="stylesheet" href="/styles/base.css" />
<style>
  body {
    background: var(--void);
    color: var(--chalk);
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
  }
  .nf {
    max-width: 540px;
  }
  .nf-code {
    font-family: var(--font-display);
    font-size: clamp(96px, 18vw, 220px);
    color: var(--signal);
    letter-spacing: -0.04em;
    line-height: 0.9;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .nf-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 4vw, 48px);
    text-transform: uppercase;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
    color: var(--chalk);
  }
  .nf-body {
    font-family: var(--font-body);
    font-size: 17px;
    color: color-mix(in oklab, var(--chalk) 75%, transparent);
    margin-bottom: 32px;
  }
  .nf-back {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    background: var(--signal);
    color: var(--void);
    padding: 14px 22px;
    border: 1px solid var(--signal);
    transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
  }
  .nf-back::before { content: "[ "; opacity: 0.5; }
  .nf-back::after  { content: " ]"; opacity: 0.5; }
  .nf-back:hover { background: var(--chalk); }
</style>
</head>
<body>
  <div class="nf">
    <div class="nf-code">404</div>
    <h1 class="nf-title">Wrong turn.</h1>
    <p class="nf-body">This page either moved, never existed, or is part of an interview I didn't pass. Either way — the rest of the portfolio's that way.</p>
    <a href="/" class="nf-back">Back to start →</a>
  </div>
</body>
</html>
